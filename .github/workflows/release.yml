# Builds BPSR_MIDI_Player.exe on Windows and attaches it to the GitHub
# release whenever you push a version tag (v1.0.0, v1.1.0, ...).
#
# Usage:  git tag v1.0.0 && git push origin v1.0.0

name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller==6.16.0 pytest==8.4.2 pip-audit==2.9.0

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt

      - name: Run complete test suite
        run: |
          python -m pytest -q

      - name: Build executable
        run: >
          pyinstaller --onefile --windowed --name BPSR_MIDI_Player
          --collect-all customtkinter
          --hidden-import mido.backends.rtmidi
          main.py

      - name: Attach to release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          files: dist/BPSR_MIDI_Player.exe
          generate_release_notes: true
